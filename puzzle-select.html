<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>パズル</title>

  <link rel="stylesheet" href="puzzle-select.css">
</head>

<body>

  <main class="puzzle-select">

    <!-- 戻る -->
    <a href="index.html" class="back-button">←</a>

    <!-- タイトル -->
    <div class="title-board">
      <h1>パズル</h1>
    </div>

    <!-- テーマ -->
    <div class="theme-grid">

      <button class="theme-card animal" data-theme="animal">
        <img src="images/puzzle/animal/cat.png" alt="">
        <span>どうぶつ</span>
      </button>

      <button class="theme-card vehicle" data-theme="vehicle">
        <img src="images/puzzle/vehicle/car.png" alt="">
        <span>のりもの</span>
      </button>

      <button class="theme-card food" data-theme="food">
        <img src="images/puzzle/food/fruits.png" alt="">
        <span>たべもの</span>
      </button>

      <button class="theme-card sea" data-theme="sea">
        <img src="images/puzzle/sea/dolphin.png" alt="">
        <span>うみのいきもの</span>
      </button>

      <button class="theme-card insect" data-theme="insect">
        <img src="images/puzzle/insect/ladybug.png" alt="">
        <span>むし</span>
      </button>

    </div>

  </main>

  <script src="puzzle-select.js"></script>
</body>
</html>
